<article class="card service-card">
  <div class="card-body">
    <h3 class="card-title">{{ include.item.title }}</h3>
    <p class="card-text">{{ include.item.description }}</p>
    {% if include.item.deliverables %}
    <ul class="small">
      {% for d in include.item.deliverables %}
        <li>{{ d }}</li>
      {% endfor %}
    </ul>
    {% endif %}
    {% if include.item.cta %}
      <a class="btn btn-primary" href="{{ include.item.cta.url | relative_url }}">{{ include.item.cta.label }}</a>
    {% endif %}
  </div>
</article>
