<article class="card post-card">
  <a class="card-link" href="{{ include.post.url | relative_url }}">
    {% if include.post.image %}
      <img class="card-img" src="{{ include.post.image | relative_url }}" alt="{{ include.post.title }}">
    {% endif %}
    <div class="card-body">
      <h3 class="card-title">{{ include.post.title }}</h3>
      <p class="card-meta">{{ include.post.date | date: "%b %d, %Y" }}</p>
      <p class="card-text">{{ include.post.excerpt | strip_html | truncate: 140 }}</p>
    </div>
  </a>
</article>
