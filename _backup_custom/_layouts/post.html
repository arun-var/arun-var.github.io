---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="muted">{{ page.date | date: "%B %d, %Y" }} · {% if page.tags %}{{ page.tags | join: ", " }}{% endif %}</p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <hr/>
  <section class="post-cta">
    <p>Need help with something like this? <a href="{{ '/services/' | relative_url }}">Hire me</a>.</p>
  </section>
</article>
